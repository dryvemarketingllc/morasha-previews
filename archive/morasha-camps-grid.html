<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morasha Camps — Programs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  /* Scoped to .morasha-camps so this can drop into any page without style collisions */
  .morasha-camps {
    --green: #46764B;
    --darkest-green: #142B15;
    --kehillas-indigo: #1C326B;
    --kehillas-darkest: #0F131E;
    --kollel-sienna: #974426;
    --kollel-darkest: #421A0C;
    --travel-blue: #306DA5;
    --travel-darkest: #092D4F;
    --charcoal: #222222;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: 'Roboto', system-ui, sans-serif;
    --sans-cond: 'Roboto Condensed', 'Roboto', system-ui, sans-serif;
    font-family: var(--sans);
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    padding: 128px 0;
    background: #fff;
  }
  .morasha-camps *, .morasha-camps *::before, .morasha-camps *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .morasha-camps a { text-decoration: none; color: inherit; }
  .morasha-camps h3 {
    font-family: var(--serif);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.92;
  }
  .morasha-camps .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 48px;
  }
  .morasha-camps .camps-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .morasha-camps .camp-card {
    position: relative;
    aspect-ratio: 3 / 4.4;
    overflow: hidden;
    cursor: pointer;
    isolation: isolate;
    color: #fff;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
    display: block;
  }
  .morasha-camps .camp-card:hover { transform: translateY(-8px); }
  .morasha-camps .camp-card .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: transform 1s cubic-bezier(.2,.8,.2,1), filter .5s ease;
    z-index: 0;
  }
  .morasha-camps .camp-card:hover .bg { transform: scale(1.08); filter: saturate(0.3); }
  .morasha-camps .camp-card::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,0.7) 80%, rgba(0,0,0,0.85) 100%);
    z-index: 1;
  }
  .morasha-camps .camp-card .tint {
    position: absolute; inset: 0;
    z-index: 2;
    opacity: 0;
    mix-blend-mode: multiply;
    transition: opacity .5s;
  }
  .morasha-camps .camp-card:hover .tint { opacity: 0.88; }
  .morasha-camps .camp-card[data-camp="morasha"] { background: var(--darkest-green); }
  .morasha-camps .camp-card[data-camp="morasha"] .tint { background: var(--green); }
  .morasha-camps .camp-card[data-camp="kehillas"] { background: var(--kehillas-darkest); }
  .morasha-camps .camp-card[data-camp="kehillas"] .tint { background: var(--kehillas-indigo); }
  .morasha-camps .camp-card[data-camp="kollel"] { background: var(--kollel-darkest); }
  .morasha-camps .camp-card[data-camp="kollel"] .tint { background: var(--kollel-sienna); }
  .morasha-camps .camp-card[data-camp="travel"] { background: var(--travel-darkest); }
  .morasha-camps .camp-card[data-camp="travel"] .tint { background: var(--travel-blue); }
  .morasha-camps .camp-card .content {
    position: absolute; inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px 28px 32px 24px;
  }
  .morasha-camps .camp-card h3 {
    color: #fff;
    font-size: clamp(44px, 4vw, 72px);
    line-height: 0.92;
    letter-spacing: -0.02em;
    text-align: left;
  }
  /* Brand-color bar at bottom of each card — always visible */
  .morasha-camps .camp-card::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 6px;
    z-index: 4;
    pointer-events: none;
    background: currentColor;
    transition: height .35s ease;
  }
  .morasha-camps .camp-card:hover::after { height: 10px; }
  .morasha-camps .camp-card[data-camp="morasha"] { color: var(--green); }
  .morasha-camps .camp-card[data-camp="kehillas"] { color: var(--kehillas-indigo); }
  .morasha-camps .camp-card[data-camp="kollel"] { color: var(--kollel-sienna); }
  .morasha-camps .camp-card[data-camp="travel"] { color: var(--travel-blue); }
  .morasha-camps .camp-card .content { color: #fff; }

  /* Travel card sub-options on hover */
  .morasha-camps .camp-card.has-sub .content { transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .morasha-camps .camp-card.has-sub:hover .content { transform: translateY(-168px); }
  .morasha-camps .sub-options {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    padding: 0 24px 24px;
    gap: 6px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .3s ease, transform .4s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .morasha-camps .camp-card.has-sub:hover .sub-options,
  .morasha-camps .camp-card.has-sub:focus-within .sub-options {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .morasha-camps .sub-options a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.28);
    backdrop-filter: blur(8px);
    border-radius: 4px;
    color: #fff;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.01em;
    transition: all .25s;
  }
  .morasha-camps .sub-options a::after {
    content: "→";
    font-family: var(--serif);
    font-size: 16px;
    opacity: 0.7;
    transition: transform .25s, opacity .25s;
  }
  .morasha-camps .sub-options a:hover {
    background: #fff;
    color: var(--travel-darkest);
    border-color: #fff;
  }
  .morasha-camps .sub-options a:hover::after {
    transform: translateX(4px);
    opacity: 1;
  }

  /* "Launching 2027" badge */
  .morasha-camps .launching {
    position: absolute;
    top: 24px; left: 24px;
    z-index: 4;
    background: #fff;
    color: var(--kehillas-indigo);
    font-family: var(--sans-cond);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .morasha-camps .launching::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--kehillas-indigo);
    animation: morasha-pulse 1.8s infinite;
  }
  @keyframes morasha-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.5; }
  }

  /* Responsive */
  @media (max-width: 1024px) {
    .morasha-camps { padding: 96px 0; }
    .morasha-camps .camps-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .morasha-camps { padding: 72px 0; }
    .morasha-camps .container { padding: 0 24px; }
    .morasha-camps .camps-grid { grid-template-columns: 1fr; }
    .morasha-camps .camp-card.has-sub:hover .content { transform: translateY(-180px); }
  }
</style>
</head>
<body>

<!-- ============================================================
     MORASHA CAMPS — Programs grid
     Drop everything between the <section> tags below into the page.
     The <style> block in <head> carries the full CSS.
     Replace the background-image URLs with hosted asset URLs.
     ============================================================ -->
<section class="morasha-camps" id="camps">
  <div class="container">
    <div class="camps-grid">

      <a class="camp-card" data-camp="morasha" href="#">
        <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1519340241574-2cec6aef0c01?w=900&q=80')"></div>
        <div class="tint"></div>
        <div class="content"><h3>Camp<br/>Morasha</h3></div>
      </a>

      <a class="camp-card" data-camp="kehillas" href="#">
        <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1502781252888-9143ba7f074e?w=900&q=80')"></div>
        <div class="tint"></div>
        <div class="launching">Launching 2027</div>
        <div class="content"><h3>Kehillas<br/>Yaakov</h3></div>
      </a>

      <a class="camp-card" data-camp="kollel" href="#">
        <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1543269865-cbf427effbad?w=900&q=80')"></div>
        <div class="tint"></div>
        <div class="content"><h3>Morasha<br/>Kollel</h3></div>
      </a>

      <div class="camp-card has-sub" data-camp="travel" tabindex="0">
        <div class="bg" style="background-image:url('https://images.unsplash.com/photo-1500051638674-ff996a0ec29e?w=900&q=80')"></div>
        <div class="tint"></div>
        <div class="content"><h3>Morasha<br/>Travel</h3></div>
        <div class="sub-options">
          <a href="#">Sulam</a>
          <a href="#">Amcha Boys</a>
          <a href="#">Amcha Girls</a>
        </div>
      </div>

    </div>
  </div>
</section>

</body>
</html>
