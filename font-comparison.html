<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font Comparison — Kefa vs Merriweather</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', sans-serif;
    background: #1a1a1a;
    color: #fff;
  }

  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: #111;
    border-bottom: 1px solid #333;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toolbar h1 {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #888;
  }
  .toolbar .controls {
    display: flex;
    gap: 8px;
  }
  .toolbar button {
    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border: 1px solid #444;
    border-radius: 4px;
    background: transparent;
    color: #ccc;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toolbar button:hover { border-color: #888; color: #fff; }
  .toolbar button.active {
    background: #46764B;
    border-color: #46764B;
    color: #fff;
  }

  .frames {
    display: flex;
    padding-top: 52px;
    height: 100vh;
  }
  .frame-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #333;
  }
  .frame-wrap:last-child { border-right: none; }
  .frame-label {
    padding: 10px 20px;
    background: #222;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .frame-label__name {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .frame-label__name.a { color: #9BBA91; }
  .frame-label__name.b { color: #64B5F6; }
  .frame-label__detail {
    font-size: 11px;
    color: #666;
  }
  .frame-wrap iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }

  /* Single view mode */
  .frames.single .frame-wrap { display: none; }
  .frames.single .frame-wrap.visible { display: flex; flex: 1; }

  /* Sync scroll indicator */
  .sync-badge {
    font-size: 10px;
    color: #46764B;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Font Comparison</h1>
  <div class="controls">
    <button class="active" onclick="setView('split')">Side by Side</button>
    <button onclick="setView('a')">Kefa Only</button>
    <button onclick="setView('b')">Merriweather Only</button>
  </div>
</div>

<div class="frames" id="frames">
  <div class="frame-wrap" id="frameA">
    <div class="frame-label">
      <span class="frame-label__name a">A — Kefa / Nunito Sans</span>
      <span class="frame-label__detail">Apple system font + Google Fonts fallback</span>
    </div>
    <iframe src="morasha-giveback-v2.html" id="iframeA"></iframe>
  </div>
  <div class="frame-wrap" id="frameB">
    <div class="frame-label">
      <span class="frame-label__name b">B — Merriweather</span>
      <span class="frame-label__detail">Google Fonts — cross-platform serif</span>
    </div>
    <iframe src="morasha-giveback-merriweather.html" id="iframeB"></iframe>
  </div>
</div>

<script>
function setView(mode) {
  const frames = document.getElementById('frames');
  const a = document.getElementById('frameA');
  const b = document.getElementById('frameB');
  const btns = document.querySelectorAll('.toolbar button');

  btns.forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  if (mode === 'split') {
    frames.classList.remove('single');
    a.classList.remove('visible');
    b.classList.remove('visible');
  } else {
    frames.classList.add('single');
    a.classList.toggle('visible', mode === 'a');
    b.classList.toggle('visible', mode === 'b');
  }
}

// Sync scroll between iframes
let syncing = false;
function syncScroll(source, target) {
  if (syncing) return;
  syncing = true;
  try {
    const sourceDoc = source.contentDocument || source.contentWindow.document;
    const targetDoc = target.contentDocument || target.contentWindow.document;
    const pct = sourceDoc.documentElement.scrollTop / (sourceDoc.documentElement.scrollHeight - sourceDoc.documentElement.clientHeight);
    targetDoc.documentElement.scrollTop = pct * (targetDoc.documentElement.scrollHeight - targetDoc.documentElement.clientHeight);
  } catch(e) {}
  syncing = false;
}

window.addEventListener('load', () => {
  const a = document.getElementById('iframeA');
  const b = document.getElementById('iframeB');

  try {
    a.contentWindow.addEventListener('scroll', () => syncScroll(a, b), { passive: true });
    b.contentWindow.addEventListener('scroll', () => syncScroll(b, a), { passive: true });
  } catch(e) {}
});
</script>

</body>
</html>
